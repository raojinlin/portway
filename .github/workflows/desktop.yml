name: Desktop Packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'internal/**'
      - 'web/**'
      - 'scripts/desktop.mjs'
      - 'tools/desktopicon/**'
      - 'go.*'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            arguments: '--universal --dmg'
          - os: windows-latest
            name: windows-amd64
            arguments: '--installer'
          - os: ubuntu-24.04
            name: linux-amd64
            arguments: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web test
          npm --prefix web run build
      - name: Test backend
        run: go test ./...
      - name: Install desktop tooling
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Test desktop backend
        working-directory: desktop
        run: go test ssh-tunnel-manager/internal/daemon ssh-tunnel-manager/internal/processlock ssh-tunnel-manager/internal/tunnel
      - name: Test desktop transport
        working-directory: desktop
        run: go test -tags production,webkit2_41 ./...
      - name: Package
        run: node scripts/desktop.mjs ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-manager-${{ matrix.name }}
          path: dist/desktop/*
          if-no-files-found: error
