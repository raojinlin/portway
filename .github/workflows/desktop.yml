name: Desktop and CLI Packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'cmd/**'
      - 'desktop/**'
      - 'internal/**'
      - 'web/**'
      - 'scripts/cli.mjs'
      - 'scripts/desktop.mjs'
      - 'tools/desktopicon/**'
      - 'go.*'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            arguments: '--universal --dmg'
            cli_arguments: '--universal'
          - os: windows-latest
            name: windows-amd64
            arguments: '--installer'
            cli_arguments: ''
          - os: ubuntu-24.04
            name: linux-amd64
            arguments: ''
            cli_arguments: ''
    runs-on: ${{ matrix.os }}
    env:
      PORTWAY_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web test
          npm --prefix web run build
      - name: Test backend
        run: go test ./...
      - name: Build command-line app
        run: node scripts/cli.mjs ${{ matrix.cli_arguments }}
      - name: Install desktop tooling
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Test desktop backend
        working-directory: desktop
        run: go test ssh-tunnel-manager/internal/daemon ssh-tunnel-manager/internal/processlock ssh-tunnel-manager/internal/tunnel
      - name: Test desktop transport
        working-directory: desktop
        run: go test -tags production,webkit2_41 ./...
      - name: Set package version
        working-directory: desktop
        run: node --input-type=module -e "import fs from 'node:fs'; const path = 'wails.json'; const config = JSON.parse(fs.readFileSync(path, 'utf8')); config.info.productVersion = process.env.PORTWAY_VERSION.replace(/^v/, ''); fs.writeFileSync(path, JSON.stringify(config, null, 2) + String.fromCharCode(10))"
      - name: Package
        run: node scripts/desktop.mjs ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: portway-${{ env.PORTWAY_VERSION }}-${{ matrix.name }}
          path: |
            dist/desktop/*
            dist/cli/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: portway-*
          path: release-artifacts
      - name: Give release assets unique names
        shell: bash
        run: |
          mkdir -p release-files
          for artifact in release-artifacts/*; do
            platform=$(basename "$artifact")
            for file in "$artifact"/*; do
              [ -f "$file" ] || continue
              cp "$file" "release-files/${platform}-$(basename "$file")"
            done
          done
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-files/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
